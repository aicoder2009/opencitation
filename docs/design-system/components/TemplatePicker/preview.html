<!-- @dsCard group="Forms" height=264 subtitle="Bracketed disclosure over a divided list" -->
<div class="oc">
  <div class="oc-state">closed</div>
  <button type="button" class="oc-action">[+] Templates <span class="oc-muted">(3)</span></button>
  <div class="oc-state" style="margin-top:16px">open</div>
  <button type="button" class="oc-action">[-] Hide Templates <span class="oc-muted">(3)</span></button>
  <div class="oc-panel" style="margin-top:12px;max-width:420px">
    <div class="oc-between" style="padding:8px;border-bottom:1px solid var(--wiki-border-light)">
      <button type="button" class="oc-action" style="text-align:left"><span class="oc-tight oc-strong">Lab notebook entry</span> <span class="oc-cap oc-muted">(Miscellaneous)</span></button>
      <button type="button" class="oc-action oc-action--xs">[delete]</button>
    </div>
    <div class="oc-between" style="padding:8px;border-bottom:1px solid var(--wiki-border-light);background:var(--wiki-offwhite)">
      <button type="button" class="oc-action" style="text-align:left"><span class="oc-tight oc-strong">Nature paper</span> <span class="oc-cap oc-muted">(Journal)</span></button>
      <button type="button" class="oc-action oc-action--xs">[delete]</button>
    </div>
    <div class="oc-between" style="padding:8px">
      <button type="button" class="oc-action" style="text-align:left"><span class="oc-tight oc-strong">Course reading</span> <span class="oc-cap oc-muted">(Book)</span></button>
      <button type="button" class="oc-action oc-action--xs">[delete]</button>
    </div>
  </div>
</div>
