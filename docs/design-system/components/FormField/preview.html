<!-- @dsCard group="Forms" height=344 subtitle="Label above field, 16px rhythm" -->
<div class="oc">
  <div class="oc-col" style="max-width:420px">
    <div class="oc-col-1">
      <label class="oc-label" for="oc-ff-title">Title</label>
      <input class="oc-input" id="oc-ff-title" value="Deep learning in citation analysis">
    </div>
    <div class="oc-col-1">
      <label class="oc-label" for="oc-ff-doi">DOI</label>
      <input class="oc-input oc-input--focus" id="oc-ff-doi" placeholder="10.1038/nature12373">
      <span class="oc-cap oc-muted">focus: border moves to wiki-link</span>
    </div>
    <div class="oc-col-1">
      <label class="oc-label" for="oc-ff-style">Citation style</label>
      <select class="oc-input" id="oc-ff-style">
        <option>APA 7th</option>
        <option>MLA 9th</option>
        <option>Chicago 17th</option>
      </select>
    </div>
    <div class="oc-col-1">
      <label class="oc-label" for="oc-ff-note">Access type</label>
      <input class="oc-input" id="oc-ff-note" value="Database" disabled style="opacity:0.5;cursor:not-allowed">
    </div>
  </div>
</div>
