<!-- @dsCard group="Forms" height=296 subtitle="Trigger, placeholder and open listbox" -->
<div class="oc">
  <div class="oc-row" style="align-items:flex-start;gap:24px">
    <div style="width:200px">
      <div class="oc-state">value set</div>
      <button type="button" class="oc-trigger"><span>APA 7th</span><span class="oc-caret" aria-hidden="true">&#9662;</span></button>
      <div class="oc-state" style="margin-top:12px">empty</div>
      <button type="button" class="oc-trigger"><span class="oc-muted">Select&#8230;</span><span class="oc-caret" aria-hidden="true">&#9662;</span></button>
    </div>
    <div style="width:200px">
      <div class="oc-state">open</div>
      <button type="button" class="oc-trigger" style="background:var(--wiki-tab-bg)"><span>APA 7th</span><span class="oc-caret" aria-hidden="true">&#9662;</span></button>
      <div class="oc-menu" style="min-width:0;margin-top:2px">
        <button type="button" role="option" aria-selected="true" class="oc-menu-item oc-menu-item--active oc-between" style="padding:6px 12px"><span>APA 7th</span><span aria-hidden="true" style="color:var(--wiki-link)">&#10003;</span></button>
        <button type="button" role="option" aria-selected="false" class="oc-menu-item" style="padding:6px 12px">MLA 9th</button>
        <button type="button" role="option" aria-selected="false" class="oc-menu-item" style="padding:6px 12px;background:var(--wiki-tab-bg)">Chicago 17th</button>
        <button type="button" role="option" aria-selected="false" class="oc-menu-item" style="padding:6px 12px">Harvard</button>
        <button type="button" role="option" aria-selected="false" class="oc-menu-item" style="padding:6px 12px">IEEE</button>
      </div>
    </div>
  </div>
</div>
