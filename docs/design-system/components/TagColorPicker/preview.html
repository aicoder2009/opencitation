<!-- @dsCard group="Content" height=208 subtitle="Ten swatches, chosen one bordered in wiki-link" -->
<div class="oc">
  <div class="oc-row" style="align-items:flex-start;gap:16px">
    <span class="oc-tag" style="background:var(--tag-teal-bg);color:var(--tag-teal-text);border-color:var(--tag-teal-border)">methods</span>
    <div style="width:256px;padding:12px;background:var(--wiki-white);border:1px solid var(--wiki-border-light);box-shadow:var(--shadow-md)">
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px">
        <button type="button" class="oc-swatch" aria-label="gray" style="background:var(--tag-gray-active-bg)"></button>
        <button type="button" class="oc-swatch" aria-label="red" style="background:var(--tag-red-active-bg)"></button>
        <button type="button" class="oc-swatch" aria-label="orange" style="background:var(--tag-orange-active-bg)"></button>
        <button type="button" class="oc-swatch" aria-label="yellow" style="background:var(--tag-yellow-active-bg)"></button>
        <button type="button" class="oc-swatch" aria-label="green" style="background:var(--tag-green-active-bg)"></button>
        <button type="button" class="oc-swatch oc-swatch--active" aria-label="teal" aria-pressed="true" style="background:var(--tag-teal-active-bg)"></button>
        <button type="button" class="oc-swatch" aria-label="blue" style="background:var(--tag-blue-active-bg)"></button>
        <button type="button" class="oc-swatch" aria-label="indigo" style="background:var(--tag-indigo-active-bg)"></button>
        <button type="button" class="oc-swatch" aria-label="purple" style="background:var(--tag-purple-active-bg)"></button>
        <button type="button" class="oc-swatch" aria-label="pink" style="background:var(--tag-pink-active-bg)"></button>
      </div>
      <div class="oc-cap oc-muted" style="margin-top:8px">teal</div>
    </div>
  </div>
</div>
