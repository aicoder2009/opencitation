<!-- @dsCard group="Actions" height=176 subtitle="Square, bordered, never filled" -->
<div class="oc">
  <div class="oc-col">
    <div>
      <div class="oc-state">default &middot; primary &middot; disabled</div>
      <div class="oc-row">
        <button type="button" class="oc-btn">Cancel</button>
        <button type="button" class="oc-btn oc-btn--primary">Save citation</button>
        <button type="button" class="oc-btn" disabled>Export</button>
      </div>
    </div>
    <div>
      <div class="oc-state">hover fill &middot; active fill &middot; focus ring</div>
      <div class="oc-row">
        <button type="button" class="oc-btn" style="background:var(--wiki-tab-bg)">Copy all</button>
        <button type="button" class="oc-btn" style="background:var(--wiki-border-light)">Copy all</button>
        <button type="button" class="oc-btn" style="outline:1px dotted var(--wiki-text);outline-offset:2px">Copy all</button>
      </div>
    </div>
  </div>
</div>
