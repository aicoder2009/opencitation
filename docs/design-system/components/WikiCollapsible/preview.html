<!-- @dsCard group="Content" height=280 subtitle="Toggle label is the state" -->
<div class="oc">
  <div class="oc-col" style="max-width:480px">
    <div class="oc-panel" style="background:var(--wiki-offwhite)">
      <div class="oc-panel-head">
        <span class="oc-tight oc-strong">Source metadata</span>
        <button type="button" class="oc-action" aria-expanded="true">[hide]</button>
      </div>
      <div class="oc-panel-body">
        <dl class="oc-tight" style="margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 16px">
          <dt class="oc-muted">Publisher</dt><dd style="margin:0">Harper &amp; Row</dd>
          <dt class="oc-muted">DOI</dt><dd style="margin:0">10.1038/nature12373</dd>
          <dt class="oc-muted">Accessed</dt><dd style="margin:0">September 20, 2026</dd>
        </dl>
      </div>
    </div>
    <div class="oc-panel" style="background:var(--wiki-offwhite)">
      <div class="oc-panel-head">
        <span class="oc-tight oc-strong">Advanced filters</span>
        <button type="button" class="oc-action" aria-expanded="false">[show]</button>
      </div>
    </div>
  </div>
</div>
