<!-- @dsCard group="Forms" height=376 subtitle="Month grid, future days disabled" -->
<div class="oc">
  <div style="width:232px">
    <label class="oc-label" for="oc-dp">Date accessed</label>
    <button type="button" class="oc-trigger" id="oc-dp" style="padding:6px 8px;margin-top:4px">September 20, 2026</button>
    <div class="oc-menu" style="min-width:0;margin-top:4px">
      <div class="oc-between oc-menu-head" style="padding:8px 12px">
        <button type="button" class="oc-link oc-tight" style="width:24px;text-align:center">&#8249;</button>
        <span class="oc-tight" style="font-weight:600">September 2026</span>
        <button type="button" class="oc-tight" style="width:24px;text-align:center;background:none;border:0;color:var(--wiki-text-muted);opacity:0.5;cursor:not-allowed">&#8250;</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);padding:8px 8px 0">
        <div class="oc-cap-b oc-muted" style="text-align:center;padding:4px 0">Su</div>
        <div class="oc-cap-b oc-muted" style="text-align:center;padding:4px 0">Mo</div>
        <div class="oc-cap-b oc-muted" style="text-align:center;padding:4px 0">Tu</div>
        <div class="oc-cap-b oc-muted" style="text-align:center;padding:4px 0">We</div>
        <div class="oc-cap-b oc-muted" style="text-align:center;padding:4px 0">Th</div>
        <div class="oc-cap-b oc-muted" style="text-align:center;padding:4px 0">Fr</div>
        <div class="oc-cap-b oc-muted" style="text-align:center;padding:4px 0">Sa</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);padding:0 8px 8px">
        <span></span><span></span>
        <button type="button" style="width:32px;height:32px;font-size:14px;background:none;border:0;color:var(--wiki-text);cursor:pointer">15</button>
        <button type="button" style="width:32px;height:32px;font-size:14px;background:none;border:0;color:var(--wiki-text);cursor:pointer">16</button>
        <button type="button" style="width:32px;height:32px;font-size:14px;background:var(--wiki-tab-bg);border:0;color:var(--wiki-text);cursor:pointer">17</button>
        <button type="button" style="width:32px;height:32px;font-size:14px;background:none;border:0;color:var(--wiki-text);cursor:pointer">18</button>
        <button type="button" style="width:32px;height:32px;font-size:14px;background:none;border:0;color:var(--wiki-link);font-weight:700;cursor:pointer">19</button>
        <button type="button" aria-pressed="true" style="width:32px;height:32px;font-size:14px;background:var(--wiki-tab-bg);border:1px solid var(--wiki-link);color:var(--wiki-link);font-weight:600;cursor:pointer">20</button>
        <button type="button" disabled style="width:32px;height:32px;font-size:14px;background:none;border:0;color:var(--wiki-text-muted);opacity:0.5;cursor:not-allowed">21</button>
        <button type="button" disabled style="width:32px;height:32px;font-size:14px;background:none;border:0;color:var(--wiki-text-muted);opacity:0.5;cursor:not-allowed">22</button>
        <button type="button" disabled style="width:32px;height:32px;font-size:14px;background:none;border:0;color:var(--wiki-text-muted);opacity:0.5;cursor:not-allowed">23</button>
      </div>
      <div style="padding:6px 12px;border-top:1px solid var(--wiki-border-light);text-align:right">
        <button type="button" class="oc-action oc-action--xs">[clear]</button>
      </div>
    </div>
  </div>
</div>
