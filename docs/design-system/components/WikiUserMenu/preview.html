<!-- @dsCard group="Overlays" height=256 subtitle="Square avatar and account panel" -->
<div class="oc">
  <div class="oc-row" style="align-items:flex-start;gap:40px">
    <div>
      <div class="oc-state">image &middot; initials &middot; loading &middot; 28px</div>
      <div class="oc-row">
        <span aria-hidden="true" style="width:32px;height:32px;border:1px solid var(--wiki-border-light);background:var(--wiki-offwhite)"></span>
        <span aria-hidden="true" style="width:32px;height:32px;border:1px solid var(--wiki-border-light);background:var(--wiki-tab-bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700">S</span>
        <span aria-hidden="true" style="width:32px;height:32px;background:var(--wiki-border-light)"></span>
        <span aria-hidden="true" style="width:28px;height:28px;border:1px solid var(--wiki-border-light);background:var(--wiki-tab-bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700">S</span>
      </div>
    </div>
    <div>
      <div class="oc-state">open</div>
      <div style="width:192px;border:1px solid var(--wiki-border);background:var(--wiki-white)">
        <div style="padding:8px 12px;border-bottom:1px solid var(--wiki-border-light)">
          <div class="oc-tight">shakthi</div>
          <div class="oc-cap oc-muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">shakthi@example.edu</div>
        </div>
        <button type="button" class="oc-menu-item"><span class="oc-link">Profile</span></button>
        <button type="button" class="oc-menu-item" style="background:var(--wiki-offwhite)"><span class="oc-link">Settings</span></button>
        <button type="button" class="oc-menu-item"><span class="oc-link">Sign out</span></button>
      </div>
    </div>
  </div>
</div>
