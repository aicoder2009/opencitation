<!-- @dsCard group="Content" height=232 subtitle="Ten hash-assigned slots, resting and active" -->
<div class="oc">
  <div class="oc-state">resting &middot; ten palette slots</div>
  <div class="oc-row" style="gap:6px">
    <span class="oc-tag" style="background:var(--tag-gray-bg);color:var(--tag-gray-text);border-color:var(--tag-gray-border)">unsorted</span>
    <span class="oc-tag" style="background:var(--tag-red-bg);color:var(--tag-red-text);border-color:var(--tag-red-border)">contested</span>
    <span class="oc-tag" style="background:var(--tag-orange-bg);color:var(--tag-orange-text);border-color:var(--tag-orange-border)">preprint</span>
    <span class="oc-tag" style="background:var(--tag-yellow-bg);color:var(--tag-yellow-text);border-color:var(--tag-yellow-border)">to read</span>
    <span class="oc-tag" style="background:var(--tag-green-bg);color:var(--tag-green-text);border-color:var(--tag-green-border)">verified</span>
    <span class="oc-tag" style="background:var(--tag-teal-bg);color:var(--tag-teal-text);border-color:var(--tag-teal-border)">methods</span>
    <span class="oc-tag" style="background:var(--tag-blue-bg);color:var(--tag-blue-text);border-color:var(--tag-blue-border)">chapter 2</span>
    <span class="oc-tag" style="background:var(--tag-indigo-bg);color:var(--tag-indigo-text);border-color:var(--tag-indigo-border)">seminal</span>
    <span class="oc-tag" style="background:var(--tag-purple-bg);color:var(--tag-purple-text);border-color:var(--tag-purple-border)">theory</span>
    <span class="oc-tag" style="background:var(--tag-pink-bg);color:var(--tag-pink-text);border-color:var(--tag-pink-border)">fieldwork</span>
  </div>
  <div class="oc-state" style="margin-top:20px">active filter &middot; swatch divider in tag-active-inner-border</div>
  <div class="oc-row" style="gap:6px">
    <span class="oc-tag" style="background:var(--tag-teal-active-bg);color:var(--tag-teal-active-text);border-color:var(--tag-teal-active-border)"><span aria-hidden="true" style="border-right:1px solid var(--tag-active-inner-border);padding-right:6px">&#9679;</span>methods</span>
    <span class="oc-tag" style="background:var(--tag-yellow-active-bg);color:var(--tag-yellow-active-text);border-color:var(--tag-yellow-active-border)"><span aria-hidden="true" style="border-right:1px solid var(--tag-active-inner-border);padding-right:6px">&#9679;</span>to read</span>
    <span class="oc-tag" style="background:var(--tag-gray-active-bg);color:var(--tag-gray-active-text);border-color:var(--tag-gray-active-border)"><span aria-hidden="true" style="border-right:1px solid var(--tag-active-inner-border);padding-right:6px">&#9679;</span>unsorted</span>
  </div>
</div>
