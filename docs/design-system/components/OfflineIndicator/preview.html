<!-- @dsCard group="Feedback" height=280 subtitle="State in words and icon, never in hue" width=960 -->
<div class="oc" style="padding:0">
  <div style="background:var(--wiki-offwhite);border-top:1px solid var(--wiki-border-light);border-bottom:1px solid var(--wiki-border-light);padding:8px 16px;color:var(--wiki-text)">
    <div class="oc-between" style="max-width:896px;margin:0 auto">
      <div class="oc-row-3">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l18 18M8.5 16.5a5 5 0 017 0M5 12.5a10 10 0 0114 0"></path><circle cx="12" cy="20" r="1" fill="currentColor"></circle></svg>
        <div>
          <div class="oc-tight oc-strong">Offline</div>
          <div class="oc-cap oc-muted">3 changes are saved on this device and will sync when you reconnect.</div>
        </div>
      </div>
      <div class="oc-row">
        <button type="button" class="oc-action" style="padding:4px 12px">[sync now]</button>
        <button type="button" aria-label="Show sync detail" aria-expanded="true" style="background:none;border:0;padding:4px;color:var(--wiki-text-muted);cursor:pointer">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="transform:rotate(180deg)"><path d="M6 9l6 6 6-6"></path></svg>
        </button>
      </div>
    </div>
    <div style="max-width:896px;margin:12px auto 0;padding-top:12px;border-top:1px solid var(--wiki-border-light)">
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">
        <div><div class="oc-cap oc-muted">Status</div><div class="oc-tight oc-strong">Offline</div></div>
        <div><div class="oc-cap oc-muted">Pending</div><div class="oc-tight oc-strong">3 items</div></div>
        <div><div class="oc-cap oc-muted">Last Sync</div><div class="oc-tight oc-strong">14 minutes ago</div></div>
        <div><div class="oc-cap oc-muted">Last Error</div><div class="oc-tight oc-strong oc-muted">None</div></div>
      </div>
    </div>
  </div>
</div>
