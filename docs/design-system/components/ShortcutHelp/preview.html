<!-- @dsCard group="Overlays" height=392 subtitle="Description left, keys right" -->
<div class="oc" style="padding:0">
  <div class="oc-scrim" style="padding:24px">
    <div class="oc-dialog-box">
      <div class="oc-between" style="padding:16px;border-bottom:1px solid var(--wiki-border-light)">
        <h3 class="oc-dialog">Keyboard Shortcuts</h3>
        <button type="button" class="oc-close" aria-label="Close">&#10005;</button>
      </div>
      <div style="padding:16px">
        <div style="margin-bottom:16px">
          <h4 class="oc-tight oc-strong oc-muted" style="margin-bottom:8px">Global</h4>
          <div class="oc-col-1">
            <div class="oc-between" style="padding:4px 0"><span class="oc-tight">Open the command palette</span><span><kbd class="oc-kbd">&#8984;K</kbd></span></div>
            <div class="oc-between" style="padding:4px 0"><span class="oc-tight">Show this sheet</span><span><kbd class="oc-kbd">?</kbd></span></div>
            <div class="oc-between" style="padding:4px 0"><span class="oc-tight">Close any overlay</span><span><kbd class="oc-kbd">Esc</kbd></span></div>
          </div>
        </div>
        <div>
          <h4 class="oc-tight oc-strong oc-muted" style="margin-bottom:8px">Citations</h4>
          <div class="oc-col-1">
            <div class="oc-between" style="padding:4px 0"><span class="oc-tight">Add a citation</span><span><kbd class="oc-kbd">A</kbd></span></div>
            <div class="oc-between" style="padding:4px 0"><span class="oc-tight">Copy the selected citation</span><span><kbd class="oc-kbd">C</kbd></span></div>
            <div class="oc-between" style="padding:4px 0"><span class="oc-tight">Move between citations</span><span><kbd class="oc-kbd">J</kbd> / <kbd class="oc-kbd">K</kbd></span></div>
          </div>
        </div>
        <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--wiki-border-light)">
          <p class="oc-cap oc-muted" style="text-align:center">Shortcuts are off while you are typing in a field.</p>
        </div>
      </div>
    </div>
  </div>
</div>
