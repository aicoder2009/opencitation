<!-- @dsCard group="Actions" height=264 subtitle="Trigger plus floating action menu" -->
<div class="oc">
  <div class="oc-row" style="align-items:flex-start;gap:32px">
    <div>
      <div class="oc-state">closed</div>
      <button type="button" class="oc-btn">Export <span aria-hidden="true">&#9662;</span></button>
    </div>
    <div>
      <div class="oc-state">open</div>
      <button type="button" class="oc-btn" style="background:var(--wiki-tab-bg)">Export <span aria-hidden="true">&#9662;</span></button>
      <div class="oc-menu" style="margin-top:4px">
        <button type="button" class="oc-menu-item">Plain text<span class="oc-hint">.txt</span></button>
        <button type="button" class="oc-menu-item" style="background:var(--wiki-tab-bg)">BibTeX<span class="oc-hint">.bib</span></button>
        <button type="button" class="oc-menu-item">RIS<span class="oc-hint">.ris</span></button>
        <div class="oc-menu-sep"></div>
        <button type="button" class="oc-menu-item">Copy all to clipboard<span class="oc-hint">&#8984;&#8679;C</span></button>
      </div>
    </div>
  </div>
</div>
