<!-- @dsCard group="Navigation" height=200 subtitle="Active tab merges into the panel below" -->
<div class="oc">
  <div class="oc-tabs" role="tablist" aria-label="Citation source">
    <button type="button" role="tab" aria-selected="true" class="oc-tab oc-tab--active">Manual entry</button>
    <button type="button" role="tab" aria-selected="false" class="oc-tab">Lookup</button>
    <button type="button" role="tab" aria-selected="false" class="oc-tab" style="background:var(--wiki-offwhite)">Import</button>
  </div>
  <div style="border:1px solid var(--wiki-border-light);border-top:0;padding:16px">
    <p class="oc-tight">Fill the fields for your source. Everything saves locally first, so this keeps working offline.</p>
  </div>
</div>
