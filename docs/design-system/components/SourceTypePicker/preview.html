<!-- @dsCard group="Forms" height=344 subtitle="Common types inline, the rest in a searchable menu" -->
<div class="oc">
  <label class="oc-label" style="margin-bottom:8px">Source type</label>
  <div class="oc-row">
    <button type="button" class="oc-btn">Book</button>
    <button type="button" class="oc-btn oc-btn--selected">Journal</button>
    <button type="button" class="oc-btn">Website</button>
    <button type="button" class="oc-btn">Newspaper</button>
    <button type="button" class="oc-btn">More <span aria-hidden="true">&#9662;</span></button>
  </div>
  <div class="oc-menu" style="margin-top:4px;width:240px">
    <div class="oc-menu-head" style="padding:8px">
      <input class="oc-input oc-input--sm" placeholder="Search source types&#8230;" id="oc-stp-q">
    </div>
    <div>
      <div class="oc-eyebrow" style="padding:6px 12px;background:var(--wiki-offwhite);border-bottom:1px solid var(--wiki-border-light)">Print</div>
      <button type="button" class="oc-menu-item" style="padding:6px 12px">Blog</button>
      <div class="oc-eyebrow" style="padding:6px 12px;background:var(--wiki-offwhite);border-bottom:1px solid var(--wiki-border-light);border-top:1px solid var(--wiki-border-light)">Audiovisual</div>
      <button type="button" class="oc-menu-item" style="padding:6px 12px">Video</button>
      <button type="button" class="oc-menu-item oc-between" style="padding:6px 12px;background:var(--wiki-tab-bg)"><span>Film</span><span aria-hidden="true" style="color:var(--wiki-link)">&#10003;</span></button>
      <button type="button" class="oc-menu-item" style="padding:6px 12px">TV Series</button>
      <button type="button" class="oc-menu-item" style="padding:6px 12px">TV Episode</button>
    </div>
  </div>
</div>
