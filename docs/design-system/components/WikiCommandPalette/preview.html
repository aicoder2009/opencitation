<!-- @dsCard group="Navigation" height=392 subtitle="Fuzzy command search over a scrim" -->
<div class="oc" style="padding:0">
  <div class="oc-scrim" style="padding:24px 24px 40px">
    <div class="oc-dialog-box">
      <div style="border-bottom:1px solid var(--wiki-border-light)">
        <input class="oc-input" id="oc-palette-q" style="border:0;padding:12px 16px" value="lis" aria-label="Search commands">
      </div>
      <div role="listbox" aria-label="Commands">
        <div class="oc-eyebrow" style="padding:8px 16px 4px">Navigation</div>
        <button type="button" role="option" aria-selected="true" class="oc-between" style="width:100%;padding:8px 16px;background:var(--wiki-tab-bg);border:0;font-size:14px;line-height:1.4286;cursor:pointer;text-align:left">
          <span class="oc-link">Go to Lists</span><span class="oc-cap oc-muted">G then L</span>
        </button>
        <button type="button" role="option" aria-selected="false" class="oc-between" style="width:100%;padding:8px 16px;background:none;border:0;font-size:14px;line-height:1.4286;cursor:pointer;text-align:left">
          <span class="oc-link">Go to Projects</span><span class="oc-cap oc-muted">G then P</span>
        </button>
        <div class="oc-eyebrow" style="padding:8px 16px 4px">Actions</div>
        <button type="button" role="option" aria-selected="false" class="oc-between" style="width:100%;padding:8px 16px;background:none;border:0;font-size:14px;line-height:1.4286;cursor:pointer;text-align:left">
          <span class="oc-link">New list</span><span class="oc-cap oc-muted">N</span>
        </button>
      </div>
      <div class="oc-row" style="gap:16px;padding:8px 16px;border-top:1px solid var(--wiki-border-light);font-size:12px;color:var(--wiki-text-muted)">
        <span><kbd class="oc-kbd">&#8593;&#8595;</kbd> navigate</span>
        <span><kbd class="oc-kbd">Enter</kbd> select</span>
        <span><kbd class="oc-kbd">Esc</kbd> close</span>
      </div>
    </div>
  </div>
</div>
