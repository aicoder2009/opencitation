<!-- @dsCard group="Feedback" height=216 subtitle="The one decorative graphic and the one gradient" -->
<div class="oc">
  <div class="oc-toast" role="status" aria-live="polite">
    <div class="oc-row-3" style="align-items:flex-start">
      <svg width="48" height="48" viewBox="0 0 100 100" aria-hidden="true" style="flex-shrink:0">
        <defs><radialGradient id="oc-barnstar" cx="50%" cy="45%" r="55%">
          <stop offset="0%" stop-color="var(--barnstar-highlight)"></stop>
          <stop offset="55%" stop-color="var(--barnstar-gold)"></stop>
          <stop offset="100%" stop-color="var(--barnstar-shade)"></stop>
        </radialGradient></defs>
        <polygon points="50,4 61,37 96,37 68,58 79,92 50,71 21,92 32,58 4,37 39,37" fill="url(#oc-barnstar)" stroke="var(--barnstar-stroke)" stroke-width="2" stroke-linejoin="round"></polygon>
      </svg>
      <div class="oc-grow">
        <div class="oc-tight oc-bold">The Citation Barnstar</div>
        <div class="oc-cap oc-muted" style="margin-bottom:8px">100 citations saved</div>
        <p class="oc-cap">For steady, careful work building a reference library one source at a time.</p>
      </div>
      <button type="button" class="oc-action oc-action--xs oc-muted" aria-label="Dismiss">[&#215;]</button>
    </div>
  </div>
</div>
